<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Runner's High Hormone Simulator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <h1>Runner's High Hormone Simulator</h1>
    <p class="subtitle">
      러너스 하이 관련 호르몬 변화를 직접 측정하지 않고 시뮬레이션하는 연구 도구
    </p>

    <section class="card">
  <label>나이</label>
  <input type="number" id="age" value="17" min="10" max="80" />

  <label>안정 시 심박수(bpm)</label>
  <input type="number" id="restingHR" value="70" min="40" max="120" />

  <label>운동 중 평균 심박수(bpm)</label>
  <input type="number" id="exerciseHR" value="145" min="80" max="220" />

  <label>운동 시간: <span id="durationValue">30</span>분</label>
  <input type="range" id="duration" min="10" max="60" value="30" />

  <button onclick="runSimulation()">시뮬레이션 실행</button>
</section>

    <section class="card">
      <canvas id="hormoneChart"></canvas>
    </section>

    <section class="card result">
      <h2>분석 결과</h2>
      <p id="bestTime"></p>
      <p id="interpretation"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
